[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-pricing"
version = "0.2.0"
description = "订单计价与结算业务工程（MiniMax × OceanBase 赛道验证样例）"
requires-python = ">=3.11,<4.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/order_pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
