<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>StudyFlow —— 具有长期记忆的 AI 学习教练</title>
    <meta
      name="description"
      content="StudyFlow 使用 PowerContext 保存学习者的长期学习记忆，跨会话记住薄弱知识点与复习进度。"
    />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236366f1'/%3E%3Ctext x='32' y='43' font-size='34' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand__mark">S</div>
          <div>
            <div class="brand__name">StudyFlow</div>
            <div class="brand__tag">具有长期记忆的 AI 学习教练</div>
          </div>
        </div>

        <nav id="nav"></nav>

        <div class="sidebar__foot">
          <div class="row" style="gap:6px">
            <span>学习者</span>
            <span
              id="user-badge"
              class="badge badge--brand"
              style="cursor:pointer"
              title="点击切换学习者 ID"
            ></span>
          </div>
          <div style="margin-top:6px">长期记忆由 PowerContext 提供</div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="menu-toggle" id="menu-toggle" aria-label="打开导航">☰</button>
          <div>
            <div class="topbar__title" id="page-title">学习概览</div>
            <div class="topbar__sub" id="page-sub"></div>
          </div>
          <div class="topbar__spacer"></div>
        </header>

        <main class="content" id="content">
          <div class="skeleton skeleton--block"></div>
        </main>
      </div>
    </div>

    <div class="toasts"></div>

    <script type="module" src="/assets/js/main.js"></script>
  </body>
</html>
