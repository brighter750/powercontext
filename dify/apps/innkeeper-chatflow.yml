        desc: 旅人代号决定翻开哪一本记忆册；同一个代号在任意新会话里都会读到同一本册子。
        selected: false
        title: 开始
        type: start
        variables:
        - label: 旅人代号
          max_length: 32
          options: []
          required: true
          type: text-input
          variable: player_id
      height: 116
      id: start
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import re

          def main(player_id: str) -> dict:
              raw = (player_id or "").strip()
              # 只保留字母、数字、下划线、连字符、点与中文，去掉会破坏 JSON 的引号反斜杠等字符
              cleaned = re.sub(r"[^\w\s\-.]", "", raw, flags=re.UNICODE)
              cleaned = re.sub(r"\s+", " ", cleaned).strip()
              display = cleaned[:32] if cleaned else "无名客"
              key_source = re.sub(r"\s+", "-", cleaned) if cleaned else "anonymous"
              key_source = re.sub(r"[^\w\-.]", "-", key_source)
              return {
                  "display_name": display,
                  "scope_key": ("dify-innkeeper-" + key_source)[:256],
                  "scope_title": ("忘忧酒肆 · 记忆册 · " + display)[:256],
                  "scope_summary": ("旅人 " + display + " 在忘忧酒肆的记忆册，由 Dify Chatflow 维护。")[:2000],
              }
        code_language: python3
        desc: 清洗旅人代号，生成幂等键与记忆册标题，避免特殊字符破坏 JSON 请求体。
        outputs:
          display_name:
            children: null
            type: string
          scope_key:
            children: null
            type: string
          scope_summary:
            children: null
            type: string
          scope_title:
            children: null
            type: string
        selected: false
        title: 准备旅人档案
        type: code
        variables:
