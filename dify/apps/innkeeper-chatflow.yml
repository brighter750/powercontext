    - data:
        code: |
          import json

          def main(scope_body: str) -> dict:
              try:
                  payload = json.loads(scope_body)
              except Exception as error:
                  raise ValueError("PowerContext /v1/scopes 返回的不是合法 JSON：" + str(scope_body)[:200]) from error
              scope_id = payload.get("scope_id") or ""
              if not scope_id:
                  raise ValueError("PowerContext /v1/scopes 没有返回 scope_id：" + str(scope_body)[:200])
              return {"scope_id": scope_id}
        code_language: python3
        desc: 从建册响应里取出 scope_id，后续所有读写都用它定位这本记忆册。
