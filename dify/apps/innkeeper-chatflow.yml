          max_read_timeout: 30
          max_write_timeout: 30
        title: 读取记忆册
        type: http-request
        url: '{{#env.POWERCONTEXT_BASE_URL#}}/v1/memory/entries/list'
        variables: []
      height: 148
      id: load_memory
      position:
        x: 1200
        y: 300
      positionAbsolute:
        x: 1200
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import json

          def main(entries_body: str, display_name: str) -> dict:
              payload = json.loads(entries_body)
              entries = payload.get("entries") or []
              if entries:
                  lines = []
                  for index, entry in enumerate(entries, start=1):
                      kind = entry.get("kind") or "记忆"
                      text = entry.get("text") or ""
                      lines.append(str(index) + ". [" + str(kind) + "] " + str(text))
                  digest = "\n".join(lines)
                  stage = "熟客"
              else:
                  digest = "（空：这本记忆册还没有任何记录）"
                  stage = "新客"
              return {
                  "memory_digest": digest,
                  "memory_count": str(len(entries)),
                  "guest_stage": stage,
              }
        code_language: python3
        desc: 把记忆册压成给模型看的摘要，并判断这位旅人今天是新客还是熟客。
        outputs:
          guest_stage:
            children: null
            type: string
          memory_count:
            children: null
            type: string
          memory_digest:
            children: null
            type: string
        selected: false
        title: 整理记忆册摘要
        type: code
        variables:
        - value_selector:
          - load_memory
          - body
          variable: entries_body
        - value_selector:
