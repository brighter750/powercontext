    - data:
        code: |
          import json
          import re

          ALLOWED_KINDS = ("fact", "trait", "promise", "prank", "story")
          TRUTHY = ("true", "1", "yes", "y")
          FALSY = ("false", "0", "no", "n")

          def _extract_payload(raw):
              blocks = re.findall(r"```(?:json)?\s*(.*?)```", raw, flags=re.DOTALL | re.IGNORECASE)
              candidates = list(blocks)
              start = raw.rfind("{")
              end = raw.rfind("}")
              if start != -1 and end > start:
                  candidates.append(raw[start:end + 1])
              for candidate in candidates:
                  try:
                      parsed = json.loads(candidate)
                  except Exception:
                      continue
                  if isinstance(parsed, dict):
                      return parsed
              return {}

          def _strip_block(raw):
              cleaned = re.sub(r"```(?:json)?\s*.*?```", "", raw, flags=re.DOTALL | re.IGNORECASE)
              cleaned = re.sub(r"\{.*\}", "", cleaned, flags=re.DOTALL)
              return cleaned.strip()

          def main(llm_text: str, scope_id: str) -> dict:
              raw = llm_text or ""
              payload = _extract_payload(raw)
              flag_raw = payload.get("remember")
              kind = str(payload.get("kind") or "").strip().lower()
              memory_text = " ".join(str(payload.get("text") or "").split())
              if kind not in ALLOWED_KINDS:
                  kind = "story"
              if isinstance(flag_raw, bool):
                  flag = flag_raw
              elif isinstance(flag_raw, str) and flag_raw.strip().lower() in TRUTHY + FALSY:
                  flag = flag_raw.strip().lower() in TRUTHY
              else:
                  flag = bool(memory_text)
              if not memory_text:
                  flag = False
              narration = _strip_block(raw)
              if not narration:
                  narration = "掌柜没吭声，低头把杯子擦了两遍。"
              remember_payload = json.dumps(
                  {"scope_id": scope_id, "kind": kind, "text": memory_text},
                  ensure_ascii=False,
              )
              return {
                  "narration": narration,
                  "remember_flag": "true" if flag else "false",
                  "memory_kind": kind,
                  "memory_text": memory_text,
                  "remember_payload": remember_payload,
              }
        code_language: python3
        desc: 把掌柜的话和要落库的 JSON 拆开，并预序列化写入请求体，避免中文和引号把 JSON 弄坏。
        outputs:
          memory_kind:
            children: null
            type: string
          memory_text:
            children: null
            type: string
          narration:
            children: null
            type: string
          remember_flag:
            children: null
            type: string
          remember_payload:
            children: null
            type: string
        selected: false
        title: 拆开掌柜的话
        type: code
        variables:
        - value_selector:
          - llm
          - text
          variable: llm_text
        - value_selector:
          - scope_parse
          - scope_id
          variable: scope_id
      height: 180
      id: parse
      position:
        x: 2040
        y: 300
      positionAbsolute:
        x: 2040
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
