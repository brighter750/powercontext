    - data:
        code: |
          import json

          def main(narration: str, entries_body: str, display_name: str, scope_id: str) -> dict:
              payload = json.loads(entries_body)
              entries = payload.get("entries") or []
              lines = []
              for index, entry in enumerate(entries, start=1):
                  kind = entry.get("kind") or "记忆"
                  text = entry.get("text") or ""
                  lines.append(str(index) + ". [" + str(kind) + "] " + str(text))
              if lines:
                  book = "\n".join(lines)
                  footer = "（记忆册来自 PowerContext：scope " + str(scope_id) + "，共 " + str(len(entries)) + " 条）"
              else:
                  book = "（这本记忆册还是空的）"
                  footer = "（记忆册来自 PowerContext：scope " + str(scope_id) + "）"
              final_answer = (
                  str(narration).strip()
                  + "\n\n【记忆册 · " + str(display_name) + "】\n"
                  + book
                  + "\n"
                  + footer
              )
              return {"final_answer": final_answer}
